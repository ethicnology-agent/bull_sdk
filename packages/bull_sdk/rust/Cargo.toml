[package]
name = "rust_lib_bull_sdk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
log = "0.4"
# Transaction signature verification (GHSA-6jp4-8v48-cc5v guard); versions
# already unified in the graph via boltz/lwk.
bitcoin = "0.32"
miniscript = "12"
# Cross-repository dependencies use immutable revisions so clean builds remain
# reproducible.
bitbox = { git = "https://github.com/ethicnology-agent/bitbox-dart", rev = "4ef1df2acf7941699d8e15c0941ede5319af7263", features = ["bull_sdk"] }
bbqr = { git = "https://github.com/SatoshiPortal/bbqr-rust.git", rev = "e4807767d6a61cd7fd9a590f33437553595d0305", default-features = false }
dart_bbqr = { git = "https://github.com/ethicnology-agent/bbqr-dart", rev = "b0a7ce9e0e6f1b9f599ccf5466d2d7073ebc582d", features = ["bull_sdk"] }
# SatoshiPortal/boltz-dart develop + SwapMasterKey.createFromSeed (feat/swap-master-key-from-seed).
boltz = { git = "https://github.com/ethicnology-agent/boltz-dart", rev = "cec1c62b0da640a190fe024d71d369f3d9d42db8", features = ["bull_sdk"] }
# lwk-dart develop: LWK master, seed-based descriptor and signing, Liquid
# regtest (SatoshiPortal/lwk-dart#99, which includes #88).
lwk = { git = "https://github.com/ethicnology-agent/lwk-dart", rev = "66d7a83c94e26551d8b09d424b8cb46af358b090", features = ["bull_sdk"] }
dart_bwk = { git = "https://github.com/ethicnology-agent/bwk-dart", rev = "56cc6ad17d78359767cf28b2bdef37220ac45d5b", package = "dart_bwk", features = ["bull_sdk"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
