[package]
name = "rust_lib_bull_sdk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
log = "0.4"
# Pinned by commit rev, not `branch` — a branch ref is a moving pointer: if
# migrate-to-bull-sdk is force-pushed or deleted upstream, the commit Cargo.lock
# already resolved to becomes unreachable and a future `cargo build` (or any
# clean-clone rebuild) fails to fetch it, even though the lockfile pins the
# exact rev. Bump these by hand (rev + Cargo.lock) once migrate-to-bull-sdk is
# merged/retired upstream.
bitbox = { git = "https://github.com/SatoshiPortal/bitbox-dart", rev = "c110af7517707ce3ab847bff32762375703d42c3", features = ["bull_sdk"] }
bbqr = { git = "https://github.com/SatoshiPortal/bbqr-rust.git", rev = "e4807767d6a61cd7fd9a590f33437553595d0305", default-features = false }
dart_bbqr = { git = "https://github.com/SatoshiPortal/bbqr-dart", rev = "b06901953ab9c0440a9c0373efcc4345f3c35d32", features = ["bull_sdk"] }
boltz = { git = "https://github.com/SatoshiPortal/boltz-dart", rev = "2a94c9b0219b7aa81aa4b219f37c4dd654fce4cf", features = ["bull_sdk"] }
# TEMPORARY test-week pin: SatoshiPortal/lwk-dart#88 (Liquid UTXO consolidation)
# isn't merged/tagged yet — pinned by rev (not branch, per the convention
# above) to the PR's tip as of 2026-07-22 (includes 3ede959's fix for a dead
# drain_lbtc_wallet() call in build_custom_tx). Re-point to a proper
# `develop`/`main`/minor-release tag once #88 lands upstream (targeted next
# Wednesday).
lwk = { git = "https://github.com/SatoshiPortal/lwk-dart", rev = "f554c7842f1f4b8e59c72d10a6f0747cb03fa315", features = ["bull_sdk"] }
dart_bwk = { git = "https://github.com/ethicnology-agent/bwk-dart", rev = "e8de69564a8acdd0eeec3b1395e6e278a352495a", package = "dart_bwk", features = ["bull_sdk"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
