[workspace]
members = [
    "packages/bull_sdk/rust",
]
exclude = [
    # Not a member, and not a dependency of rust_lib_bull_sdk. onion ships as
    # its own Flutter plugin with its own .so, like bdk_dart and payjoin
    # already do in the app: it carries a native Android/iOS side of its own
    # (the IPtProxy Snowflake transport), which a plain member crate cannot.
    #
    # This split was originally forced rather than chosen: `arti-client` pulls
    # tor-dirmgr -> rusqlite -> libsqlite3-sys 0.34, ark-client pulled sqlx 0.8
    # -> libsqlite3-sys 0.28, and cargo allows only one package per graph to
    # declare `links = "sqlite3"`. Ark has since been dropped from the SDK, so
    # that specific conflict is gone — but do not assume the graphs now unify:
    # merging would need the remaining `links = "sqlite3"` claimants re-checked
    # against arti's 0.34, and would pull all of arti into the shared .so.
    "packages/onion/rust",
    "packages/bbqr/rust",
    "packages/bitbox/rust",
    "packages/boltz/rust",
    "packages/lwk/rust",
]
resolver = "2"

# Cargo ignores dependency-level patches. Match lwk-dart's pinned siblings so
# the aggregate bridge uses one copy of each LWK type.
[patch.crates-io]
lwk_common = { git = "https://github.com/SatoshiPortal/lwk", rev = "f80953d0b45af7cb5950128e44ca47e618b114cc" }
lwk_jade = { git = "https://github.com/SatoshiPortal/lwk", rev = "f80953d0b45af7cb5950128e44ca47e618b114cc" }
lwk_prices = { git = "https://github.com/SatoshiPortal/lwk", rev = "f80953d0b45af7cb5950128e44ca47e618b114cc" }
lwk_registry = { git = "https://github.com/SatoshiPortal/lwk", rev = "f80953d0b45af7cb5950128e44ca47e618b114cc" }

[profile.dev]
debug = false

[profile.release]
debug = false
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
